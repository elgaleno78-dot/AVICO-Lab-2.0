<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVICO SIM-OBST 1.2</title><style>:root{font-family:Arial,sans-serif;color:#102c4e;background:#eef5fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:auto;padding:24px}header{background:linear-gradient(110deg,#072b57,#1767ad);color:white;padding:28px;border-radius:0 0 22px 22px}h1{margin:4px 0}h2{margin:6px 0 15px}small{opacity:.8}.card{background:white;border:1px solid #cddff0;border-radius:17px;padding:22px;margin:20px 0;box-shadow:0 5px 22px #0e40720d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eaf3fc;padding:14px;border-radius:10px}.stat strong{display:block;font-size:23px;color:#a52637}.muted{color:#56718d}.choice{display:block;border:1px solid #b6cee4;padding:14px;margin:9px 0;border-radius:10px;cursor:pointer}.choice:has(input:checked){background:#e4f2ff;border:2px solid #1767ad}.btn{border:0;background:#1263a7;color:white;padding:14px 19px;border-radius:10px;font-size:16px;cursor:pointer}.btn:disabled{background:#a5b6c7}.secondary{background:white;color:#1263a7;border:1px solid #1263a7}.feedback{border-left:4px solid #1465a3;background:#eaf3fc;padding:15px;border-radius:8px}textarea{width:100%;min-height:90px;padding:12px;border:1px solid #b6cee4;border-radius:8px}select{padding:12px;width:100%;border-radius:9px;border:1px solid #b6cee4}.progress{height:9px;background:#d5e2ee;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#2575b7}footer{text-align:center;padding:24px;color:#667}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}</style></head><body><header><div class="wrap"><small>AVICO SALUD · SIMULACIÓN CLÍNICA</small><h1>SIM-OBST 1.2</h1><div>Detección temprana de hemorragia posparto · Módulo 05</div></div></header><main class="wrap"><div class="card"><label for="case">Selecciona un caso clínico</label><select id="case"></select><p class="muted">Basado en la ponencia «Hemorragia obstétrica: definiciones». Simulador educativo, no validado para decisiones asistenciales.</p></div><div id="app"></div></main><footer>AVICO Salud · Ciencia para una mejor obstetricia</footer><script>
const cases=[
{name:"A · Sangrado temprano y taquicardia",history:"28 años, parto vaginal hace 20 minutos. Sangrado activo.",states:[[350,112,110,72,"Útero blando y sangrado persistente."],[560,122,98,62,"Persiste sangrado, piel fría."],[900,135,85,51,"Palidez y deterioro progresivo."]],cause:"Tono"},
{name:"B · Sangrado subestimado",history:"32 años, parto vaginal; cuantificación inicial visual posiblemente inexacta.",states:[[280,125,89,55,"Diaforesis y mareo; sangrado oculto o subestimado posible."],[460,133,83,50,"Sangrado persistente y debilidad."],[750,145,76,43,"Hipoperfusión progresiva."]],cause:"Tono"},
{name:"C · Presión aparentemente conservada",history:"25 años, parto vaginal, sangrado reciente.",states:[[560,95,116,76,"Paciente alerta; presión arterial conservada."],[780,108,108,68,"Se observa aumento del sangrado."],[1100,123,94,56,"Cambios hemodinámicos evidentes."]],cause:"Tono"},
{name:"D · Sangrado con útero contraído",history:"30 años, parto instrumentado reciente.",states:[[430,113,101,64,"Útero firme; sangrado rojo activo."],[650,123,93,59,"Sangrado sin disminución y tono conservado."],[950,138,82,52,"Empeoramiento circulatorio."]],cause:"Trauma"},
{name:"E · Hemorragia posparto secundaria",history:"29 años, día 9 posparto. Sangrado vaginal abundante y dolor hipogástrico.",states:[[420,111,102,66,"Febrícula y dolor uterino."],[610,124,96,60,"Sangrado persiste; considerar infección y restos."],[900,133,86,50,"Empeoramiento hemodinámico."]],cause:"Tejido"},
{name:"F · Hemorragia y anemia",history:"24 años, parto vaginal; anemia prenatal conocida (Hb 8.5 g/dL).",states:[[330,109,103,65,"Palidez previa, taquicardia y sangrado activo."],[500,120,96,60,"Disnea leve y aumento de palidez."],[760,134,84,52,"Compromiso hemodinámico progresivo."]],cause:"Tono"}
];
const tasks=[
{title:"Reconocimiento temprano",q:"¿Cuál es tu interpretación del sangrado y la situación hemodinámica?",choices:["No hay preocupación hasta perder más de 1000 mL","Evaluar inmediatamente criterios de HPP, signos clínicos y tendencia del sangrado","Esperar la hemoglobina para decidir"],correct:1,why:"Integra pérdida sanguínea, signos clínicos e índice de choque. El umbral de 300 mL con un signo anormal de compromiso circulatorio favorece detección precoz, sin esperar una cifra mayor."},
{title:"Reevaluación dinámica",q:"¿Qué debe orientar la siguiente decisión?",choices:["Valorar volumen acumulado, signos vitales, índice de choque, síntomas y tendencia temporal","Considerar exclusivamente la presión arterial sistólica","Mantener observación pasiva hasta que aparezca hipotensión intensa"],correct:0,why:"La evaluación seriada es esencial. La presión aislada puede permanecer relativamente conservada a pesar de pérdidas significativas."},
{title:"Orientación etiológica",q:"¿Qué etiología merece mayor prioridad según los hallazgos de este caso?",choices:["Tono (atonía uterina)","Trauma (lesión del canal del parto)","Tejido retenido","Trombina (alteración de coagulación)","Malformación vascular"],correct:null,why:"El marco T-5M permite razonar según tono uterino, traumatismo, restos, alteraciones de coagulación y causas vasculares."}
];
let caseId=0,stage=0,score=0,answered=false,records=[];const app=document.getElementById("app"),chooser=document.getElementById("case");cases.forEach((c,i)=>chooser.add(new Option(c.name,i)));chooser.addEventListener("change",()=>{caseId=Number(chooser.value);restart()});
function restart(){stage=0;score=0;answered=false;records=[];render()}function correctFor(){return stage===2?["Tono","Trauma","Tejido","Trombina","Malformación"].indexOf(cases[caseId].cause):tasks[stage].correct}function render(){const c=cases[caseId],s=c.states[Math.min(stage,2)],t=tasks[Math.min(stage,2)],shock=(s[1]/s[2]).toFixed(2);if(stage>=3){app.innerHTML='<div class="card"><h2>Resultado del caso</h2><h1>'+score+'/100 puntos</h1><p>Se completaron las tres decisiones.</p><div id="report"></div><p><button class="btn" id="again">Repetir caso</button> <button class="btn secondary" id="download">Exportar informe JSON</button></p></div>';document.getElementById("report").textContent=records.map((r,i)=>(i+1)+". "+r.title+": "+(r.correct?"Adecuada":"Revisar")).join(" | ");document.getElementById("again").onclick=restart;document.getElementById("download").onclick=()=>{const blob=new Blob([JSON.stringify({simulador:"AVICO SIM-OBST 1.2",caso:c.name,puntuacion:score,respuestas:records},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="avico-sim-obst-resultado.json";a.click();URL.revokeObjectURL(a.href)};return}app.innerHTML='<div class="card"><div class="muted">ETAPA '+(stage+1)+' DE 3 · '+t.title+'</div><div class="progress"><div style="width:'+stage*33.33+'%"></div></div><h2>'+c.name+'</h2><p>'+c.history+'</p><div class="stats"><div class="stat">Sangrado <strong>'+s[0]+' mL</strong></div><div class="stat">FC <strong>'+s[1]+' lpm</strong></div><div class="stat">PA <strong>'+s[2]+'/'+s[3]+'</strong></div><div class="stat">Índice de choque <strong>'+shock+'</strong></div></div><p><b>Exploración:</b> '+s[4]+'</p></div><div class="card"><h2>'+t.q+'</h2>'+t.choices.map((a,i)=>'<label class="choice"><input type="radio" name="response" value="'+i+'"> '+a+'</label>').join("")+'<p><label for="reason">Justifica tu decisión (opcional)</label><textarea id="reason" placeholder="Explica qué datos sustentan tu interpretación..."></textarea></p><div id="feedback"></div><button class="btn" id="confirm">Confirmar decisión</button></div>';document.getElementById("confirm").onclick=confirm}
function confirm(){if(answered)return;const selected=document.querySelector('input[name="response"]:checked');if(!selected){document.getElementById("feedback").innerHTML='<p class="feedback">Selecciona una respuesta para continuar.</p>';return}const choice=Number(selected.value),valid=choice===correctFor(),pts=[40,30,30][stage];if(valid)score+=pts;records.push({title:tasks[stage].title,selected:tasks[stage].choices[choice],justificacion:document.getElementById("reason").value,correct:valid,puntos:valid?pts:0});answered=true;const why=stage===2?"La orientación principal en este caso es "+cases[caseId].cause+". "+tasks[stage].why:tasks[stage].why;document.getElementById("feedback").innerHTML='<div class="feedback"><b>'+(valid?"Decisión adecuada.":"Decisión para revisar.")+'</b><p>'+why+'</p><p><b>Resultado parcial:</b> '+score+' puntos.</p></div>';const b=document.getElementById("confirm");b.textContent=stage===2?"Ver informe final":"Continuar a la siguiente etapa →";b.onclick=()=>{stage++;answered=false;render()};}
render();
</script></body></html>
